apiVersion: apps/v1
kind: Deployment
metadata:
  name: barterbrain-backend
  namespace: barterbrain-dev
  labels:
    app: barterbrain-backend
    project: barterbrain
spec:
  replicas: 1

  selector:
    matchLabels:
      app: barterbrain-backend

  template:
    metadata:
      labels:
        app: barterbrain-backend
        project: barterbrain

    spec:
      containers:
        - name: backend
          image: IMAGE_URI
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: barterbrain-backend-config

            - secretRef:
                name: barterbrain-backend-secret

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: barterbrain-backend-service
  namespace: barterbrain-dev
  labels:
    app: barterbrain-backend
    project: barterbrain

spec:
  type: ClusterIP

  selector:
    app: barterbrain-backend

  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
