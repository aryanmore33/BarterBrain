
apiVersion: apps/v1
kind: Deployment
metadata:
  name: barterbrain-redis
  namespace: barterbrain-dev
  labels:
    app: barterbrain-redis
    project: barterbrain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: barterbrain-redis
  template:
    metadata:
      labels:
        app: barterbrain-redis
        project: barterbrain
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: barterbrain-redis
  namespace: barterbrain-dev
  labels:
    app: barterbrain-redis
    project: barterbrain
spec:
  type: ClusterIP
  selector:
    app: barterbrain-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
