apiVersion: batch/v1
kind: Job
metadata:
  name: barterbrain-db-migration
  namespace: barterbrain-dev
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: barterbrain-db-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: IMAGE_URI
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - ./node_modules/.bin/knex migrate:latest --knexfile knexfile.js
          envFrom:
            - configMapRef:
                name: barterbrain-backend-config
            - secretRef:
                name: barterbrain-backend-secret
