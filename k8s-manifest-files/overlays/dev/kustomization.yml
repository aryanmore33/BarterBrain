apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: barterbrain-dev

resources:
  - ../../base

images:
  - name: IMAGE_URI
    newName: aryanmore33/barterbrain-backend
    newTag: "1.0.5"

patches:
  # - path: patch.yml
  - path: ingress-patch.yml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: barterbrain-backend-ingress
