apiVersion: apps/v1
kind: Deployment
metadata:
  name: barterbrain-api
  namespace: barterbrain
  labels:
    app: barterbrain-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: barterbrain-api

  template:
    metadata:
      labels:
        app: barterbrain-api

    spec:
      containers:
        - name: backend
          image: IMAGE_URI
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
              name: http

          envFrom:
            - secretRef:
                name: barterbrain-api-env

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: barterbrain-api
  namespace: barterbrain
spec:
  selector:
    app: barterbrain-api

  ports:
    - name: http
      port: 80
      targetPort: 3000

  type: ClusterIP